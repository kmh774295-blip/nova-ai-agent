<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<title>ভাইরাল ভিডিও জোন</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12332668' data-sdk='show_12332668'></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: var(--tg-theme-bg-color, #0f0f1a);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #9a9ab0);
    --btn: var(--tg-theme-button-color, #e63946);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1c1c2e);
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif;
    padding: 12px 12px 24px; min-height: 100vh;
  }
  h1 { font-size: 22px; text-align: center; margin: 6px 0 2px; }
  .sub { text-align: center; color: var(--hint); font-size: 13px; margin-bottom: 12px; }
  #search {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid #33334d;
    background: var(--card); color: var(--text); font-size: 15px; outline: none;
  }
  #search::placeholder { color: var(--hint); }
  .tabs { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: 1px solid #33334d;
    background: var(--card); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .tab.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; }
  .count { color: var(--hint); font-size: 13px; }
  #sort {
    padding: 7px 10px; border-radius: 10px; border: 1px solid #33334d;
    background: var(--card); color: var(--text); font-size: 13px; outline: none;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card); border-radius: 14px; overflow: hidden; cursor: pointer;
    border: 1px solid #2a2a40;
  }
  .poster {
    aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center;
    font-size: 40px; position: relative; overflow: hidden;
  }
  .poster img.thumb {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .poster .play { position: relative; z-index: 1; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
  .poster .dur {
    position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.65);
    color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 8px; z-index: 1;
  }
  .card .info { padding: 9px 10px 11px; }
  .card .title { font-size: 15px; font-weight: 600; }
  .card .meta { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .chip {
    display: inline-block; font-size: 11px; background: var(--btn); color: var(--btn-text);
    padding: 2px 8px; border-radius: 10px; margin-top: 6px;
  }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; font-size: 15px; line-height: 1.7; }
  .foot { text-align: center; color: var(--hint); font-size: 12px; margin-top: 20px; line-height: 1.7; }
  .foot a { color: var(--btn); text-decoration: none; }
  /* per-video watch button — one Monetag rewarded ad first, then the video */
  .watch {
    display: block; width: calc(100% - 20px); margin: 4px 10px 11px; padding: 10px 8px;
    border: none; border-radius: 10px; background: #22a06b; color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>🔥 ভাইরাল ভিডিও জোন</h1>
  <div class="sub">সব ভাইরাল ভিডিও এক জায়গায়</div>

  <input id="search" type="search" placeholder="🔍 ভিডিও খুঁজুন (নম্বর / ক্যাটাগরি)...">

  <div class="tabs" id="tabs"></div>

  <div class="row">
    <div class="count" id="count"></div>
    <select id="sort">
      <option value="new">🆕 নতুন প্রথম</option>
      <option value="old">🕐 পুরনো প্রথম</option>
      <option value="random">🎲 এলোমেলো</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    😔 এখনো কোনো ভিডিও যোগ হয়নি।<br>শীঘ্রই ভিডিও আসছে — একটু পরে আবার চেষ্টা করো!
  </div>

  <div class="foot">
    কার্ডের ▶️ ভিডিও দেখুন বাটন চাপ দিলে প্রথমে একটা অ্যাড দেখাবে, তারপর ভিডিওটা বট চ্যাটে পাঠানো হবে।<br>
    বট: <a href="https://t.me/viralvideolinkszone_bot" target="_blank">@viralvideolinkszone_bot</a>
  </div>

<script>
  // Per-video ad model (user order, 23 Nov ~19:30): tapping a video shows ONE
  // Monetag rewarded ad first, then the video opens. No app-open ad anymore.
  // A failed or stalled ad NEVER blocks the video (fail-open + 60s timeout).
  // PRELOAD (user order, 23 Nov ~20:00): the ad creative is preloaded once
  // after the list renders and again after each ad settles, so the ad appears
  // instantly on tap instead of being fetched cold.
  // Adsgram leg stays DISABLED: block int-61492 is still "In moderation", the
  // Adsgram SDK pops its own blocking "not active" alert on an inactive block,
  // and Adsgram's rules do not allow forcing an ad before an action — that is
  // why Monetag's rewarded format is used for the per-video ad.
  // --- disabled Adsgram code, kept for reference only; DO NOT re-enable ---
  // until block int-61492 is confirmed Active.
  // if (window.Adsgram && ADSGRAM_BLOCK_ID) {
  //   var ad = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
  //   var p = ad.show();
  //   if (p && p.then) {
  //     p.then(function () {}).catch(function () { showMonetagAd(); });
  //     return;
  //   }
  //   if (p && p.catch) { p.catch(function () { showMonetagAd(); }); return; }
  //   return;
  // }
  var ADSGRAM_BLOCK_ID = "int-61492";
  var BOT_URL = "https://t.me/viralvideolinkszone_bot";
  var MONETAG_TIMEOUT_MS = 60000;

  var adShowing = false;

  // Preload the Monetag ad creative in the background so it is ready and
  // appears instantly when a video is tapped. Fire-and-forget, fully silent:
  // it never blocks, delays, or shows anything by itself.
  function preloadAd() {
    try {
      if (typeof window.show_12332668 !== "function") return;
      var p = window.show_12332668({ type: "preload" });
      if (p && p.catch) { p.catch(function () {}); }
    } catch (e) {}
  }

  // Show ONE Monetag rewarded ad, then open the video. Fail-open: the video
  // opens anyway if the ad SDK is missing, the promise rejects, or the ad
  // does not settle within the timeout.
  function watchVideo(id, btn) {
    if (adShowing) return;
    adShowing = true;
    var done = false;
    var label = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = "⏳ অ্যাড চলছে..."; }
    var finish = function () {
      if (done) return;
      done = true;
      adShowing = false;
      if (btn) { btn.disabled = false; btn.textContent = label || "▶️ ভিডিও দেখুন"; }
      preloadAd(); // ready the next ad for the next tap
      openBot(id);
    };
    var timer = setTimeout(finish, MONETAG_TIMEOUT_MS);
    try {
      if (typeof window.show_12332668 !== "function") { clearTimeout(timer); finish(); return; }
      var p = window.show_12332668();
      if (p && p.then) {
        p.then(function () { clearTimeout(timer); finish(); })
         .catch(function () { clearTimeout(timer); finish(); });
      } else {
        clearTimeout(timer); finish();
      }
    } catch (e) { clearTimeout(timer); finish(); }
  }

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var allVideos = [];
  var activeCat = "সব";
  var query = "";

  function hueFor(id) { return (id * 47) % 360; }

  function posterStyle(id) {
    var h1 = hueFor(id), h2 = (h1 + 40) % 360;
    return "background:linear-gradient(135deg,hsl(" + h1 + ",70%,42%),hsl(" + h2 + ",70%,26%))";
  }

  function loadVideos() {
    fetch("videos.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        allVideos = d.videos || [];
        buildTabs();
        render();
        preloadAd(); // creative ready before the first tap
      })
      .catch(function () {
        document.getElementById("empty").style.display = "block";
        document.getElementById("empty").innerHTML =
          "⚠️ ভিডিও লিস্ট লোড হয়নি।<br>অ্যাপটা আবার খুলে চেষ্টা করো।";
      });
  }

  function categories() {
    var cats = ["সব"], seen = {};
    allVideos.forEach(function (v) {
      if (v.category && !seen[v.category]) { seen[v.category] = 1; cats.push(v.category); }
    });
    return cats;
  }

  function buildTabs() {
    var box = document.getElementById("tabs");
    box.innerHTML = "";
    categories().forEach(function (c) {
      var b = document.createElement("button");
      b.className = "tab" + (c === activeCat ? " active" : "");
      b.textContent = (c === "সব" ? "📂 " : "") + c;
      b.onclick = function () { activeCat = c; buildTabs(); render(); };
      box.appendChild(b);
    });
  }

  function filtered() {
    var q = query.trim().toLowerCase();
    var list = allVideos.filter(function (v) {
      if (activeCat !== "সব" && v.category !== activeCat) return false;
      if (!q) return true;
      return ("" + v.id).indexOf(q) !== -1 ||
        (v.category || "").toLowerCase().indexOf(q) !== -1 ||
        (v.caption || "").toLowerCase().indexOf(q) !== -1;
    });
    var sort = document.getElementById("sort").value;
    if (sort === "old") list.sort(function (a, b) { return a.id - b.id; });
    else if (sort === "random") list.sort(function () { return Math.random() - 0.5; });
    else list.sort(function (a, b) { return b.id - a.id; });
    return list;
  }

  function render() {
    var list = filtered();
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    document.getElementById("count").textContent = "🎬 মোট ভিডিও: " + allVideos.length;
    document.getElementById("empty").style.display = list.length ? "none" : "block";
    list.forEach(function (v) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="poster" style="' + posterStyle(v.id) + '">' +
        (v.thumb ? '<img class="thumb" src="' + escapeHtml(v.thumb) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '<span class="play">▶️</span><span class="dur">ভিডিও</span></div>' +
        '<div class="info"><div class="title">ভিডিও #' + v.id + '</div>' +
        '<div class="meta">' + (v.added_at || "") + '</div>' +
        '<span class="chip">' + escapeHtml(v.category || "") + '</span></div>' +
        '<button class="watch">▶️ ভিডিও দেখুন</button>';
      var btn = card.querySelector(".watch");
      btn.onclick = function (ev) { ev.stopPropagation(); watchVideo(v.id, btn); };
      card.onclick = function () { watchVideo(v.id, btn); };
      grid.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function openBot(id) {
    var url = BOT_URL + "?start=watch_" + id;
    if (tg) {
      try { tg.openTelegramLink(url); } catch (e) { window.open(url, "_blank"); }
      try { tg.close(); } catch (e) {}
    } else {
      window.open(url, "_blank");
    }
  }

  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value; render();
  });
  document.getElementById("sort").addEventListener("change", render);

  loadVideos();
</script>
</body>
</html>
